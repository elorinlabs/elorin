[package]
name = "prism"
version = "0.1.0"
edition = "2021"

[lib]
name = "prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
same-file = "1"
sha2 = "0.10"
notify = "8.2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.38"
jpeg-decoder = { version = "0.3.2", default-features = false }
png = "0.17"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "aes-crypto"] }
tar = "0.4.46"
flate2 = "1.1.10"
tempfile = "3"
uuid = { version = "1.27.0", features = ["v4"] }
cap-std = "4.0.3"
rusqlite = { version = "0.38", features = ["bundled", "hooks", "limits"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

